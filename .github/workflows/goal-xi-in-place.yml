name: Goal XI additive legacy upgrade
on:
  push:
    branches: [codex/caravana77-goal-xi-reconstrucao-italo-20261026]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/recovery/in-place-bootstrap.mjs'
      - 'scripts/private-recovery.mjs'
      - 'scripts/tests/in-place*.mjs'
      - 'tests/in-place-bootstrap.auth.ts'
      - 'src/lib/commercial-baseline.ts'
      - 'vitest.in-place.config.ts'
      - '.github/workflows/goal-xi-in-place.yml'
permissions:
  contents: read
jobs:
  synthetic-in-place:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bootstrap, preservation and private CLI regression guards
        run: node --test scripts/tests/in-place-bootstrap.test.mjs scripts/tests/private-recovery.test.mjs
      - name: Legacy login, atomic backfill and operational journeys with actual demo SDKs
        run: npm run test:in-place:integration
      - name: Build synthetic candidate, typecheck and lint
        run: |
          npm run build:e2e
          npm run lint
