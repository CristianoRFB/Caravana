name: Goal XIII private tenant activation
on:
  push:
    branches: [codex/caravana77-goal-xiii-activate-italo-cloud-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activation:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pure activation planner and preservation guards
        run: node --test scripts/tests/tenant-activation.test.mjs scripts/tests/in-place-bootstrap.test.mjs
      - name: Existing Auth login, private activation, revocation and unknown finance with demo SDKs
        run: npm run test:tenant-activation:integration
      - name: Legacy SDK journeys remain compatible without rewriting historical evidence
        run: npm run test:in-place:integration
      - name: Preserve previously verified Goal XI evidence
        run: git diff --exit-code -- tests/in-place-bootstrap.auth.ts docs/operations/goal-xi-italo/sdk-rehearsal.json
