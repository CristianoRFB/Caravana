name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, codex/caravana77-commercial-v1-20261016, codex/caravana77-goal-xiii-activate-italo-cloud-20261026, codex/caravana77-goal-xiii-pc-20261027]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # R$0: only a public repository on the standard hosted runner.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck opt-in staging and restore harnesses (no remote execution)
        run: npm run typecheck:staging

      - name: Read-only staging audit guards (no credentials or remote audit)
        run: |
          python3 -m venv "$RUNNER_TEMP/caravana-readonly-venv"
          "$RUNNER_TEMP/caravana-readonly-venv/bin/python" -m pip install -r scripts/staging-readonly-requirements.txt
          "$RUNNER_TEMP/caravana-readonly-venv/bin/python" -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Unit, integration and Firestore Rules
        run: npm test

      - name: Bounded public health transport (synthetic streams only)
        run: node --test scripts/tests/staging-health-bounds.test.mjs scripts/tests/staging-appcheck.test.mjs scripts/tests/staging-monitor.test.mjs scripts/tests/staging-monitor-runtime.test.mjs

      - name: Auth emulator integration
        run: npm run test:demo

      - name: Storage Rules with Auth
        run: npm run test:storage

      - name: Coordinated Auth Firestore Storage recovery (synthetic emulator only)
        run: npm run test:recovery

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Private proof viewer CSP with synthetic in-memory data only
        run: node --test scripts/tests/private-viewer-csp.test.mjs

      - name: Compiled cutover bootstrap with synthetic metadata and blocked external network
        run: node --test scripts/tests/italo-bootstrap-browser.test.mjs

      - name: Desktop and mobile E2E (synthetic only)
        run: npm run test:e2e

      - name: Private history subpath against the published legacy Rules contract (synthetic only)
        run: npm run test:italo-private:e2e

      - name: Record synthetic browser summary without artifact storage
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, appendFileSync } from 'node:fs';
          for (const [label, path] of [['Synthetic E2E', 'test-results/e2e-report.json'], ['Private history E2E', 'test-results-italo-private/e2e-report.json']]) {
            const stats = existsSync(path) ? JSON.parse(readFileSync(path, 'utf8')).stats : { result: 'E2E report unavailable; inspect previous steps' };
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## ' + label + '\n```json\n' + JSON.stringify(stats, null, 2) + '\n```\n');
          }
          NODE

      - name: Build
        run: npm run build
